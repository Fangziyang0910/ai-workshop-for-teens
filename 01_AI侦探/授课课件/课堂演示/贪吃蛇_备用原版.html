<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>贪吃蛇 · 原版</title>
<style>
:root{color-scheme:light;--ink:#142e49;--muted:#617487;--gold:#efb43d;--line:#d9e2e8}*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:var(--ink);font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #236da4;outline-offset:4px}header{max-width:1120px;margin:auto;padding:28px 24px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-size:14px;letter-spacing:2px}.version{font-size:14px;color:var(--muted)}main{max-width:1120px;margin:24px auto;display:grid;grid-template-columns:minmax(360px,600px) 1fr;gap:40px;padding:0 24px}.board{position:relative;aspect-ratio:1;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px #0b22371c;background:#102c47}canvas{width:100%;height:100%;display:block}.cover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#102c47cf;color:white;text-align:center;padding:28px;backdrop-filter:blur(3px)}.cover[hidden]{display:none}.cover h2{font-size:52px;letter-spacing:6px;margin:0 0 15px}.cover p{font-size:18px;line-height:1.8;max-width:340px;color:#d7e4ed}.cover button{border:0;background:var(--gold);color:#102c47;border-radius:9px;padding:14px 35px;font-weight:700;margin-top:15px}aside{padding-top:12px}h1{font-size:42px;letter-spacing:1px;margin:0 0 8px}.intro{font-size:16px;color:var(--muted);line-height:1.8;margin:0 0 30px}.scores{display:flex;gap:38px;padding:23px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.scores small{display:block;color:var(--muted);font-size:13px;margin-bottom:10px}.scores strong{font-size:43px;font-weight:700;font-variant-numeric:tabular-nums}.speed{display:flex;justify-content:space-between;margin:25px 0;font-size:16px}.speed strong{color:#226e90}.buttons{display:flex;gap:12px}.buttons button{border:1px solid var(--line);padding:13px 20px;background:white;border-radius:8px;color:var(--ink);flex:1}.buttons button:first-child{background:var(--ink);color:white;border-color:var(--ink)}.keys{margin-top:30px;font-size:15px;line-height:2;color:var(--muted)}kbd{display:inline-block;min-width:29px;padding:0 6px;border:1px solid #bfcdd8;background:white;border-radius:5px;font:inherit;text-align:center;color:var(--ink)}#status{margin-top:25px;font-size:14px;color:#426b7e;min-height:24px}.caption{font-size:12px;color:var(--muted);margin-top:20px;line-height:1.8}@media(max-width:800px){main{grid-template-columns:1fr;max-width:620px;gap:20px}h1{font-size:32px}aside{padding:0 0 25px}.intro{margin-bottom:15px}header{padding-top:18px}.scores{padding:14px 0}.scores strong{font-size:30px}}
</style>
<header><span class="brand">AI 创想工坊 / 课堂作品</span><span class="version">课前备用 · 原版</span></header>
<main><section class="board" aria-label="贪吃蛇游戏区域"><canvas id="board" width="600" height="600" aria-label="用方向键移动贪吃蛇"></canvas><div class="cover" id="cover"><h2 id="cover-title">SNAKE</h2><p id="cover-message">吃到食物，身体变长。<br>避开墙壁和自己的身体。</p><button id="start">开始游戏</button></div></section>
<aside><h1>贪吃蛇</h1><p class="intro">熟悉的规则，新的作品。<br>从一次试玩开始检查你的想法。</p><div class="scores"><div><small>本局得分</small><strong id="score">00</strong></div><div><small>最高得分</small><strong id="best">00</strong></div></div><p class="speed"><span>移动速度</span><strong id="speed"></strong></p><div class="buttons"><button id="pause">开始</button><button id="restart">重新开始</button></div><p class="keys"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 控制方向<br><kbd>空格</kbd> 暂停 / 继续</p><div id="status" role="status" aria-live="polite">准备就绪</div><p class="caption">每吃到一个食物加 1 分。<br>本页是课前备用成品，可离线运行。</p></aside></main>
<script>
const STEP_MS = 200;
const SIZE=24,CELL=25,canvas=document.querySelector('#board'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let body,direction,pending,food,score,mode,last=0,elapsed=0,best=0;
try{best=Number(localStorage.getItem('ai-snake-best'))||0;}catch{}
$('speed').textContent=`每秒 ${1000/STEP_MS} 格`;
function reset(){body=[{x:6,y:12},{x:5,y:12},{x:4,y:12}];direction={x:1,y:0};pending=null;food={x:10,y:12};score=0;mode='ready';elapsed=0;showCover('SNAKE','吃到食物，身体变长。<br>避开墙壁和自己的身体。','开始游戏');update();draw();}
function showCover(title,message,label){$('cover-title').textContent=title;$('cover-message').innerHTML=message;$('start').textContent=label;$('cover').hidden=false;}
function update(){$('score').textContent=String(score).padStart(2,'0');$('best').textContent=String(best).padStart(2,'0');$('pause').textContent=mode==='running'?'暂停':mode==='paused'?'继续':'开始';$('status').textContent={ready:'准备就绪',running:'正在游戏',paused:'已暂停',over:'本局结束，点击重新开始',won:'你填满了整个棋盘！'}[mode];}
function toggle(){if(mode==='running'){mode='paused';showCover('已暂停','准备好后，继续这一局。','继续游戏');}else if(mode==='paused'||mode==='ready'){mode='running';elapsed=0;$('cover').hidden=true;}else{reset();mode='running';$('cover').hidden=true;}update();}
function finish(won=false){mode=won?'won':'over';showCover(won?'完成挑战':'本局结束',`本局得分：${score}<br>再试一次，看看能否超过自己。`,'再来一局');update();}
function tick(){if(pending){direction=pending;pending=null;}const head={x:body[0].x+direction.x,y:body[0].y+direction.y};const eat=head.x===food.x&&head.y===food.y;const occupied=eat?body:body.slice(0,-1);if(head.x<0||head.y<0||head.x>=SIZE||head.y>=SIZE||occupied.some(p=>p.x===head.x&&p.y===head.y)){finish();return;}body.unshift(head);if(eat){score++;best=Math.max(best,score);try{localStorage.setItem('ai-snake-best',String(best));}catch{}const free=[];for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)if(!body.some(p=>p.x===x&&p.y===y))free.push({x,y});if(!free.length){finish(true);return;}food=free[Math.floor(Math.random()*free.length)];}else body.pop();update();}
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function draw(){ctx.fillStyle='#102c47';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#b7d1e60b';ctx.lineWidth=1;for(let i=1;i<SIZE;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,600);ctx.moveTo(0,i*CELL);ctx.lineTo(600,i*CELL);ctx.stroke();}ctx.shadowColor='#ff7363';ctx.shadowBlur=15;rounded(food.x*CELL+5,food.y*CELL+5,15,15,6,'#ff7667');ctx.shadowBlur=0;for(let i=body.length-1;i>=0;i--){const p=body[i];rounded(p.x*CELL+2,p.y*CELL+2,21,21,i===0?7:6,i===0?'#efb43d':`hsl(166 55% ${53-i*.3}%)`);}const h=body[0];ctx.fillStyle='#102c47';for(const offset of [-4,4]){ctx.beginPath();ctx.arc(h.x*CELL+12.5+direction.x*5+(direction.y?offset:0),h.y*CELL+12.5+direction.y*5+(direction.x?offset:0),2,0,Math.PI*2);ctx.fill();}}
function loop(t){const delta=last?Math.min(t-last,250):0;last=t;if(mode==='running'){elapsed+=delta;while(elapsed>=STEP_MS&&mode==='running'){elapsed-=STEP_MS;tick();}draw();}requestAnimationFrame(loop);}
addEventListener('keydown',e=>{const dirs={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};if(e.code==='Space'){e.preventDefault();if(!e.repeat)toggle();return;}if(!dirs[e.key])return;e.preventDefault();if(mode!=='running'||pending)return;const next=dirs[e.key];if(next.x!==-direction.x||next.y!==-direction.y)pending=next;});
$('start').onclick=toggle;$('pause').onclick=toggle;$('restart').onclick=()=>{reset();toggle();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='running')toggle();});
window.gameState=()=>({body:body.map(p=>({...p})),food:{...food},score,mode,stepMs:STEP_MS});
reset();requestAnimationFrame(loop);
</script></html>
